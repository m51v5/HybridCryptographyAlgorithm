name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Don't paste a real secret, key or private file. Make a small test file that shows the problem instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the About window.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - Encrypt
        - Decrypt
        - Update check
        - About window
        - Something else
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Test text, if it matters
      description: A short made-up text that shows the problem, like one with certain characters or a certain length.
      render: text
