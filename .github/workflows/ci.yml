name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.sln'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format
        run: dotnet format HybridCryptographyAlgorithm.sln --verify-no-changes
      - name: Build
        run: dotnet build HybridCryptographyAlgorithm.sln -c Release -warnaserror
