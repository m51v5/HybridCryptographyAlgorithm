name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ZIP: hybrid-cryptography-algorithm-${{ github.ref_name }}-windows-x64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:GITHUB_REF_NAME isn't on main"
          }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the tag matches the version
        run: |
          $version = dotnet msbuild src/HybridCryptographyAlgorithm/HybridCryptographyAlgorithm.csproj -getProperty:Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in HybridCryptographyAlgorithm.csproj"
          }
      - name: Build, third-party licenses and zip
        run: ./scripts/build-release.ps1 -Zip $env:ZIP
      - name: Publish
        run: gh release create $env:GITHUB_REF_NAME $env:ZIP --title "Hybrid Cryptography Algorithm $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
